# 업무 용어 사전(KNW, T7 후보 1). 고객·담당자가 쓰는 말 → 지식 문서가 쓰는 말.
# 검색어에만 적용한다(문서는 바꾸지 않음). 평가 질문이 아니라 문서의 낱말 수를 세어 만들었다(2026-11-08).
#   예: 문서에는 "플랜"이 0번, "요금제"가 42번 나온다.
# 실제 도입 때는 고객사 업무 담당자가 실제로 쓰는 말로 바꾼다(README "실제 회사에 도입할 때").
# 채택 여부는 평가로 정한다: 조정용 세트에서 오르고 확인용 세트에서 떨어지지 않을 때만 쓴다.

[terms]
"요금 플랜" = "요금제"
"플랜" = "요금제"
"프로모션" = "이벤트"
"행사" = "이벤트"
"내역" = "기록"
"이력" = "기록"
"로그인" = "접속"
"스토리지" = "저장 공간"
"용량" = "저장 공간"
"쓰는 양" = "사용량"
"업그레이드" = "상위 요금제"
"다운그레이드" = "하위 요금제"
"기업" = "고객"
"업체" = "고객"
"회사" = "고객"
